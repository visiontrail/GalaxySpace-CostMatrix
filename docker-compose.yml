name: costmatrix

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    image: ${DOCKERHUB_NAMESPACE:-galaxyspaceai}/costmatrix-backend:${IMAGE_TAG:-local}
    container_name: ${COMPOSE_PROJECT_NAME:-costmatrix}_backend
    environment:
      APP_NAME: ${APP_NAME:-CostMatrix}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: ${DEBUG:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:8180","http://127.0.0.1:8180"]}
      SECRET_KEY: ${SECRET_KEY:-local-development-only}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD_FILE: ${INITIAL_ADMIN_PASSWORD_FILE:-/app/config/initial_admin_password.txt}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-200}
      DATABASE_URL: ${DATABASE_URL:-}
      DB_TYPE: ${DB_TYPE:-sqlite}
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-costmatrix}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/data:/app/data
      - ./data/logs:/app/logs
      - ./config:/app/config:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    networks:
      - costmatrix-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0) if urllib.request.urlopen('http://localhost:8000/').status==200 else sys.exit(1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${DOCKERHUB_NAMESPACE:-galaxyspaceai}/costmatrix-frontend:${IMAGE_TAG:-local}
    container_name: ${COMPOSE_PROJECT_NAME:-costmatrix}_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8180}:80"
    restart: unless-stopped
    networks:
      - costmatrix-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  costmatrix-net:
    driver: bridge
